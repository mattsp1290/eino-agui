name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-vet-lint-test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.47.0

      - name: Build
        run: go build ./...

      - name: Vet and lint
        run: make check

      - name: Test
        run: go test ./...

      - name: Race-sensitive bridge tests
        run: go test -race ./convert ./emitter ./stream ./tools

      - name: Repeated agentic race tests
        run: go test -race -count=10 ./stream ./emitter

      - name: Agentic inventory and lifecycle tests
        run: go test ./internal/golden ./internal/deps ./stream -run 'Agentic|FunctionResultKind' -count=1

      - name: Clean downloaded consumer
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GOPROXY: direct
        run: GOWORK=off testdata/consumer/check.sh "$GITHUB_SHA"

  agentic-client-conformance:
    name: Agentic client conformance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out exact AG-UI fork
        uses: actions/checkout@v4
        with:
          repository: mattsp1290/ag-ui
          ref: aaa75b54d572be8cd1d51c72e951273c5b893ed0
          path: ag-ui

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact reducer conformance
        env:
          AG_UI_REPO_DIR: ${{ github.workspace }}/ag-ui
        run: testdata/agui-client/check.sh
